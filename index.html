<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lily Drainage Paris | Drainage lymphatique à domicile</title>

  <meta name="description"
        content="Drainage lymphatique et massages bien-être à domicile. Prestations à partir de 50 €.">

  <!-- Nos deux typographies -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet">

  <style>

    /* NOS COULEURS */

    :root {
      --ivoire: #F7F3ED;
      --blanc-chaud: #FFFCF8;
      --bordeaux: #692F38;
      --espresso: #29231F;
      --beige-rose: #DCCBC2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Manrope", sans-serif;
      color: var(--espresso);
      background: var(--ivoire);
    }


    /* HERO */

    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;

      background: linear-gradient(
        to top,
        rgba(247, 243, 237, 0.98) 0%,
        rgba(247, 243, 237, 0.82) 30%,
        rgba(247, 243, 237, 0.15) 68%,
        rgba(247, 243, 237, 0.02) 100%
      );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 48px 24px 42px;
    }

    .brand {
      margin-bottom: 26px;
    }

    .brand-lily {
      display: block;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(3.8rem, 16vw, 7rem);
      font-weight: 500;
      line-height: 0.8;
      letter-spacing: 0.05em;
    }

    .brand-paris {
      display: block;
      margin-top: 12px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.38em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 650px;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2.25rem, 9vw, 4.7rem);
      font-weight: 500;
      line-height: 0.96;
      margin-bottom: 18px;
    }

    .intro {
      max-width: 520px;
      font-size: 0.98rem;
      line-height: 1.65;
      margin-bottom: 22px;
    }

    .price {
      font-family: "Cormorant Garamond", serif;
      color: var(--bordeaux);
      font-size: 1.7rem;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 24px;

      background: var(--bordeaux);
      color: white;

      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.08em;

      font-size: 0.76rem;
      font-weight: 600;
    }

  </style>

</head>


<body>

  <main>

    <!-- =====================
         HERO
    ====================== -->

    <section class="hero">

      <img
        class="hero-image"
        src="hero.jpg"
        alt="Lily Drainage Paris - massage bien-être à domicile"
      >

      <div class="hero-overlay"></div>

      <div class="hero-content">

        <div class="brand">
          <span class="brand-lily">LILY</span>
          <span class="brand-paris">Drainage Paris</span>
        </div>

        <h1>
          Drainage lymphatique & massages bien-être à domicile
        </h1>

        <p class="intro">
          Des soins ciblés, pensés pour votre corps, chez vous.
        </p>

        <p class="price">
          À partir de 50 €
        </p>

        <a class="cta" href="#contact">
          Demander un devis ou un rendez-vous
        </a>

      </div>

    </section>

  </main>

</body>

</html>
